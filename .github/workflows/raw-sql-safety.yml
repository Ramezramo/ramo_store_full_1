name: Raw SQL safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reject-raw-sql-interpolation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Reject interpolated raw SQL
        run: php scripts/check_raw_sql_interpolation.php
